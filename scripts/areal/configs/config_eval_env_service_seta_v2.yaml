# Evaluation config using remote env_service nodes with seta-env-v2 dataset.
#
# Prerequisites:
#   1. bash seta_env/services/start.sh --skip-deploy --dataset seta-env-v2
#   2. (If FRP needed) python seta_env/services/frp_tunnel/manage_tunnel.py start gpu-a --ranks ...
#
# Run:
#   python -m areal.launcher.local \
#       scripts/areal/eval_env_service.py \
#       --config scripts/areal/configs/config_eval_env_service_seta_v2.yaml \
#       allocation_mode=sglang:d1p1t1+eval

experiment_name: camel-terminal_agent-eval-env-service
trial_name: trial1-seta-env-v2-eval-env-service

seed: 1
total_train_epochs: 1

tokenizer_path: ${actor.path}
enable_offload: false

# ��─ env_service connection ───────────────────────────────────────────────────
env_scheduler_url: "http://127.0.0.1:8003"
env_service_api_key: "env-service-dev-key"
dataset_name: "seta-env-v2"

# ── Eval settings ────────────────────────────────────────────────────────────
n_trajs: 8
step_timeout: 900.0
export_style: individual
tool_call_parser: qwen25

# ── AReaL infrastructure ────────────────────────────────────────────────────
cluster:
  n_nodes: 1
  n_gpus_per_node: 6
  fileroot: outputs/areal/experiments
  name_resolve:
    type: nfs
    nfs_record_root: outputs/areal/name_resolve

allocation_mode: sglang:d1p1t1+eval

rollout:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 2
  queue_size: 32
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 100
  enable_rollout_tracing: true
  check_trajectory_format: true

gconfig:
  n_samples: 1
  min_new_tokens: 0
  max_new_tokens: 4096
  greedy: true
  temperature: 1.0

ref:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  dtype: bfloat16

actor:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3-8B
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: false
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 32768
  optimizer: null

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32768
  mem_fraction_static: 0.8
  disable_radix_cache: false

train_dataset:
  batch_size: 16
  shuffle: false
  pin_memory: true
  num_workers: 4
  path: dataset/seta-env-v2
  type: rl
  max_length: 1024

valid_dataset:
  batch_size: 16
  shuffle: false
  pin_memory: true
  num_workers: 4
  path: dataset/seta-env-v2
  type: rl

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  tensorboard:
    path: ${cluster.fileroot}/${experiment_name}/${trial_name}/tensorboard

launcher:
  inference_server_cpus_per_gpu: 4
  inference_server_mem_per_gpu: 32768
  trainer_cpus_per_gpu: 4
  trainer_mem_per_gpu: 32768

perf_tracer:
  enabled: true
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  save_interval: 1
  session_tracer:
    enabled: true
    flush_threshold: 0
