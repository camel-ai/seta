# seta_env env_service config for miles RL training.
#
# Used by env_service to configure the agent, model, runtime, and evaluation.
# Model URL and API key are overridden per /step request from the session URL.
#
# Start env_service:
#   ENV_SERVICE_CONFIG=scripts/miles/seta_env_config.yaml \
#   DATASET_ROOT=dataset \
#   MAX_SLOTS=8 \
#   uvicorn seta_env.services.env_service:app --host 0.0.0.0 --port 8002

terminal_env:
  # model: url + api_key are overridden per /step request (Miles Router session URL)
  # tito_enabled pairs with Miles Router's TITO session tracking
  model:
    # Custom backend: hits SGLang /generate directly, parses DeepSeek-V4 DSML
    # tool-call format. No SGLang flag changes required (same launch as miles).
    model_platform: sglang_deepseek_v4
    model_type: /data/models/DeepSeek-V4-Flash-FP8
    url: http://localhost:30000
    tito_enabled: false       # this backend does its own token-level TITO
    model_config_dict:
      max_new_tokens: 8192
      temperature: 1.0
      top_p: 0.95
      # Matches run_deepseek_v4.py:404 — miles' default for V4 dapo_aime
      # ("thinking":true). Switch to "chat" only for fast smoke tests where
      # you don't want <think>…</think> blocks; default = "thinking".
      thinking_mode: thinking
      # 'high' is accepted by encoding_dsv4.encode_messages but the current
      # encoder has NO prefix branch for it (only 'max' injects REASONING_EFFORT_MAX).
      # Behaves like None today; included so a future encoder upgrade picks it up.
      reasoning_effort: high

  agent:
    agent: tito_train_agent
    prompt: sys_prompt_base
    # Dispatch independent tool calls within a turn via asyncio.gather instead
    # of a sequential await-loop. Per-resource concurrency safety (per-session
    # asyncio.Lock in TerminalToolkit) lives in the toolkit, not here.
    # Stress-tested 2026-05-24: 16 cases passing including same-id serialize,
    # kill+view race, error injection, cancellation, large fan-out (N=50).
    parallel_internal_tools: true
    # Hard-capped at 60000 (model's original_max_position_embeddings = 65536,
    # leave 5536 headroom). Previous value 655360 (10× the cap) let agents
    # accumulate trajectories well past Megatron's freqs_cis cache, which
    # then crashed training at rope.py:58 with
    #   RuntimeError: shape '[1, 68096, 1, 32]' is invalid for input of size 2097152
    # (the 2097152 = 65536 × 32 was the precomputed cache; 68096 was the
    # actual trajectory length the agent produced).
    max_total_tokens: 60000
    max_completion_tokens: 8192
    max_iteration: 200      # production: full trajectories (curated805 miles-router R3 run)
    tool_names:
      - shell_exec
      - shell_view
      - shell_wait
      - shell_write_to_process
      - shell_kill_process
      - shell_write_content_to_file
    # thinking: false

  runtime:
    env_type: daytona
    toolkit: auto
    # NOTE: env_service hardcodes the trial root from the HARBOR_ROOT env var
    # (default /tmp/harbor). Our launcher sets HARBOR_ROOT=/data/terminal_agent/harbor
    # so trials are persisted under /data and survive container restart.
    #
    # Resource overrides: apply to ALL task sandboxes regardless of each
    # task.toml's [environment] values. Running sandboxes are unaffected;
    # only newly-created ones see the new size. Useful for shrinking the
    # 10GB default to fit more concurrent sandboxes under Daytona's quota.
    # Hard per-sandbox resource caps so peak concurrency × per-sandbox
    # never blows past Daytona's org-wide quotas. With MAX_SLOTS=160:
    #   - CPU:    160 × 1 = 160 ≤ 250 (Daytona Total CPU limit)
    #   - Memory: 160 × 2 = 320 GB (well under cluster RAM headroom)
    #   - Disk:   160 × 6 = 960 GB ≤ 2000 GB (Daytona Total disk limit)
    # Defaults vary per task.toml (often 2 CPU / 4 GB RAM / 10 GB disk);
    # overriding here applies to ALL task sandboxes uniformly.
    override_cpus: 1
    override_memory_mb: 2048
    override_storage_mb: 6144

  env:
    reward_fn: binary
    task_timeouts:
      # 720s (12min). Pure wait-not-fail (24min) DEADLOCKED Daytona's runner pool:
      # on a batch-boundary mass-completion the pool scales down, and if creates
      # only WAIT (no fail-recycle) the autoscaler sees ~0 running and never scales
      # back up. A moderate window keeps fail-recycle CHURN alive (the scale-up
      # demand signal) while still bridging brief boundary dips. The patient retry
      # (CREATE_CAPACITY_MAX_ATTEMPTS, ~9min) sits just under this so it reraises a
      # clean "No available runners" rather than being cancelled into an empty
      # TimeoutError.
      _reset_env: 720.0
      _reset_agent: 120.0
      agent_astep: 2400.0    # raised 1000->2400: under high concurrency per-iter time is ~47s(p95),
                             # so 1000s cut the agent at ~21 iters (vs max_iteration=50) and ~7% of
                             # trajectories timed out mid-run -> cut short -> lower reward. 2400s covers
                             # 50 iters @47s/iter, making the clock non-binding (agent hits max_iteration,
                             # not the timeout). Must sit under the outer step timeout:
                             # reset(720)+reset_agent(120)+agent(2400)+evaluate(900)+cleanup(120)=4260 < STEP_TIMEOUT_SECONDS(5000).
      _evaluate_completion_sync: 900.0
      _cleanup: 120.0
