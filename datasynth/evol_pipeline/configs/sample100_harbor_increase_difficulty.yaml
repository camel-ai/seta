huggingface:
  input_repo: camel-ai/seta-env-harbor
  output_repo: null
  token_env: HF_TOKEN
paths:
  input_dir: outputs/synth_data
  output_dir: outputs/sample100_harbor_increase_difficulty
  rollout_dir: outputs/sample100_harbor_increase_difficulty_rollouts
filter_csv: configs/filters/sample100_harbor.csv
strategy:
  name: increase_difficulty
  evol_strategy: depth
  evol_target: INCREASE_DIFFICULTY
  max_variants: 1
pipeline:
  n_evol_workers: 4
  skip_timeout: false
  task_timeout_s: 3600
rollout:
  enabled: true
  n_rollout_workers: 4
  n_trajs: 1
  model_config_name: kimi_tito
  model:
    model_platform: moonshot
    model_type: kimi-k2.5
    api_key: ${oc.env:MOONSHOT_API_KEY}
    url: https://api.moonshot.ai/v1
    tito_enabled: true
    tito_validate: true
    model_config_dict:
      max_tokens: 4096
      stream: false
      temperature: 1.0
upload:
  enabled: false
