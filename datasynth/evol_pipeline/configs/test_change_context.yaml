# Test config: CHANGE_CONTEXT on 5 tasks from seta-env-harbor
# with GPT-5.4 rollout

huggingface:
  input_repo: null
  output_repo: null
  token_env: HF_TOKEN

paths:
  input_dir: outputs/synth_data
  output_dir: outputs/evol_change_context
  rollout_dir: outputs/evol_change_context_rollouts

filter_csv: configs/filters/test_5tasks.csv

strategy:
  name: change_context
  evol_strategy: breadth
  evol_target: CHANGE_CONTEXT
  max_variants: 1

pipeline:
  n_evol_workers: 4
  skip_timeout: false
  task_timeout_s: 3600

rollout:
  enabled: true
  n_rollout_workers: 4
  n_trajs: 1
  model_config_name: azure_gpt54

  model:
    model_platform: azure
    model_type: gpt-5.4
    model_config_dict:
      max_completion_tokens: 4096
      stream: false
      temperature: 1.0

upload:
  enabled: false
