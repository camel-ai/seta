# Turn 2: INCREASE_DIFFICULTY on CHANGE_CONTEXT output
# Chain: original → change_context → increase_difficulty
#
# Run AFTER test_change_context.yaml completes.

huggingface:
  input_repo: null
  output_repo: null
  token_env: HF_TOKEN

paths:
  input_dir: outputs/evol_change_context              # reads change_context output
  output_dir: outputs/evol_change_context_then_harder  # writes chained output
  rollout_dir: outputs/evol_change_context_then_harder_rollouts

filter_csv: null    # process all PASS variants from change_context run

strategy:
  name: increase_after_context
  evol_strategy: depth
  evol_target: INCREASE_DIFFICULTY
  max_variants: 1

pipeline:
  n_evol_workers: 4
  skip_timeout: false
  task_timeout_s: 3600

rollout:
  enabled: true
  n_rollout_workers: 4
  n_trajs: 1
  model_config_name: azure_gpt54

  model:
    model_platform: azure
    model_type: gpt-5.4
    model_config_dict:
      max_completion_tokens: 4096
      stream: false
      temperature: 1.0

upload:
  enabled: false
